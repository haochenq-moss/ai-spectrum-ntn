[project]
name = "ai-spectrum-ntn"
version = "0.1.0"
description = "AI Agentic Spectrum Management for Non-terrestrial Networks (6G) with Adversarial Optimization and Autonomous Research"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Research Team", email = "contact@example.com" }
]
keywords = [
    "6g",
    "spectrum-management",
    "ai-agents",
    "wireless-networks",
    "adversarial-optimization",
    "nemoIR",
    "deep-learning",
    "rag",
    "autoresearch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# ============================================================================
# COMBINED DEPENDENCIES from:
#   - RAG-Practice (LLM, RAG, wireless simulation)
#   - AutoResearch (training, optimization, experiment loop)
#   - NemoIR (workflow compilation)
#   - Core NTN Research (spectrum optimization, game theory, learning)
# ============================================================================

dependencies = [
    # ──────────────────────────────────────────────────────────────────
    # CORE ML/DEEP LEARNING (from AutoResearch & RAG-Practice)
    # ──────────────────────────────────────────────────────────────────
    "torch==2.9.1",
    "tensorflow>=2.16.0,<3.0.0",
    "transformers>=4.40.0",           # For LLM models
    "accelerate>=0.25.0",              # Distributed training
    "peft>=0.7.0",                     # Parameter-efficient fine-tuning (LoRA, QLoRA)
    
    # ──────────────────────────────────────────────────────────────────
    # LLM & AGENT FRAMEWORKS (RAG-Practice integration)
    # ──────────────────────────────────────────────────────────────────
    "autogen>=0.14.1",                 # AutoGen agent framework
    "langchain>=1.3.18",               # LangChain orchestration
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",         # OpenAI integration
    "langchain-huggingface>=1.2.2",    # HuggingFace models
    "langchain-text-splitters>=1.1.2",
    "semantic-kernel>=1.44.1",         # Microsoft Semantic Kernel
    "llama-index>=0.9.0",              # LlamaIndex for RAG
    "openai>=3.6.0",                   # OpenAI API
    "anthropic>=0.7.0",                # Claude API (for agentic reasoning)
    
    # ──────────────────────────────────────────────────────────────────
    # RETRIEVAL-AUGMENTED GENERATION (RAG-Practice)
    # ──────────────────────────────────────────────────────────────────
    "faiss-cpu>=1.15.0",               # Vector database for embeddings
    "sentence-transformers>=6.0.0",    # Text embedding models
    "chromadb>=0.4.0",                 # Vector store alternative
    "pinecone-client>=3.0.0",          # Cloud vector database
    
    # ──────────────────────────────────────────────────────────────────
    # WIRELESS SIMULATION & 6G RESEARCH
    # ──────────────────────────────────────────────────────────────────
    "sionna>=1.2.2",                   # NVIDIA Sionna for wireless simulation
    "scipy>=1.12.0",                   # Scientific computing
    "scikit-learn>=1.4.0",             # ML utilities
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "h5py>=3.10.0",                    # HDF5 for dataset storage
    
    # ──────────────────────────────────────────────────────────────────
    # OPTIMIZATION SOLVERS (AutoResearch + game theory)
    # ──────────────────────────────────────────────────────────────────
    "cvxpy>=1.7.5",                    # Convex optimization (water-filling)
    "cvxpygen>=0.6.8",                 # Code generation from CVX
    "pyomo>=6.7.0",                    # Mathematical programming
    
    # ──────────────────────────────────────────────────────────────────
    # NemoIR WORKFLOW COMPILATION (NemoIR integration)
    # ──────────────────────────────────────────────────────────────────
    "pydantic>=2.0.0",                 # Data validation (for workflow IR)
    "pyyaml>=6.0",                     # YAML parsing
    "marshmallow>=3.20.0",             # Schema validation
    
    # ──────────────────────────────────────────────────────────────────
    # API & WEB SERVING (RAG-Practice backend)
    # ──────────────────────────────────────────────────────────────────
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    
    # ──────────────────────────────────────────────────────────────────
    # REINFORCEMENT LEARNING (for agent training)
    # ──────────────────────────────────────────────────────────────────
    "stable-baselines3>=2.2.0",        # RL algorithms
    "gymnasium>=0.29.0",               # RL environments
    "shimmy>=0.2.0",                   # Gym wrapper
    
    # ──────────────────────────────────────────────────────────────────
    # EXPERIMENT TRACKING & LOGGING (AutoResearch loop)
    # ──────────────────────────────────────────────────────────────────
    "wandb>=0.16.0",                   # Weights & Biases experiment tracking
    "tensorboard>=2.14.0",
    "mlflow>=2.10.0",
    
    # ──────────────────────────────────────────────────────────────────
    # VISUALIZATION & ANALYSIS
    # ──────────────────────────────────────────────────────────────────
    "matplotlib>=3.10.8",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "networkx>=3.2.0",                 # Graph visualization (workflows)
    "graphviz>=0.20.1",
    
    # ──────────────────────────────────────────────────────────────────
    # UTILITIES
    # ──────────────────────────────────────────────────────────────────
    "python-dotenv>=1.2.3",            # Environment variables
    "click>=8.1.0",                    # CLI framework
    "tqdm>=4.66.0",                    # Progress bars
    "requests>=2.32.0",                # HTTP client
    "python-dateutil>=2.8.0",
    "pyarrow>=21.0.0",                 # Data serialization
    
    # ──────────────────────────────────────────────────────────────────
    # OCR & DOCUMENT PROCESSING (RAG-Practice)
    # ──────────────────────────────────────────────────────────────────
    "easyocr>=1.7.2",
    "unstructured[image]>=0.18.32",
    "pillow>=10.0.0",
    
    # ──────────────────────────────────────────────────────────────────
    # JUPYTER & INTERACTIVE (notebooks)
    # ──────────────────────────────────────────────────────────────────
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.15.0",
    "notebook>=7.0.0",
    "nbconvert>=7.0.0",
]

# ============================================================================
# OPTIONAL DEPENDENCY GROUPS
# ============================================================================

[project.optional-dependencies]
# Complete installation with all features
full = [
    "sionna[jax]>=1.2.2",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "optax>=0.1.9",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "isort>=5.13.0",
    "mypy>=1.7.0",
    "ruff>=0.1.8",
]

# GPU acceleration (for CUDA environments)
gpu = [
    "torch[cuda12]>=2.1.0",
    "torchvision[cuda12]>=0.16.0",
    "torchaudio>=2.1.0",
    "tensorflow[and-cuda]>=2.16.0,<3.0.0",
]

# Distributed training
distributed = [
    "ray>=2.7.0",
    "ray[tune]>=2.7.0",
    "horovod>=0.28.0",
]

# Documentation generation
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
]

# ============================================================================
# PYTORCH INDEX CONFIGURATION
# ============================================================================

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

# ============================================================================
# BUILD SYSTEM
# ============================================================================

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# ============================================================================
# PROJECT ENTRYPOINTS
# ============================================================================

[project.scripts]
ai-spectrum-ntn = "src.cli:main"
pipeline = "src.pipeline:main"
agent = "src.agent.ai_agent:main"
benchmark = "src.evaluation.benchmarks:main"

# ============================================================================
# TOOL CONFIGURATIONS
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=html"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
